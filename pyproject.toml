[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "food-allocation-optimisation"
version = "0.1.0"
description = "Evidence-aware allocation of eligible food surplus to receiving sites"
requires-python = ">=3.10"
dependencies = [
    "scipy>=1.11",
    "streamlit>=1.35",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]
research = ["ko-pron==1.3", "osmium>=4.3,<5", "zstandard>=0.23"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
